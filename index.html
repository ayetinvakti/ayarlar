<!DOCTYPE html>
<html lang="tr">
<head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <script>
        const savedTheme = localStorage.getItem('theme');
        const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (savedTheme === 'light' || (!savedTheme && !systemPrefersDark)) {
            document.documentElement.classList.add('light-mode');
        }
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ayarlar | Ayetin Vakti</title>

    <meta name="theme-color" content="#10b981">

    <style>
        :root {
            --bg-color: #0b1120;
            --card-bg: #1e293b;
            --accent-color: #10b981;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .navbar {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .back-btn {
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 1.25rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }

        .app-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--accent-color);
            text-decoration: none;
            font-family: 'Georgia', serif;
        }

        .settings-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
        }

        .settings-section-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .setting-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .setting-item:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .setting-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .setting-label {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-color);
        }

        .setting-desc {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .theme-toggle-btn {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 14px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .theme-toggle-btn:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        .footer {
            margin: 20px 0;
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-muted);
        }
        .footer span { color: var(--accent-color); font-weight: 600; }

        body.light-mode {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }
    </style>
</head>
<body>

<div class="container">
    <header class="navbar">
        <div class="nav-left">
            <a href="https://ayetinvakti.github.io/" class="back-btn" aria-label="Geri Dön">←</a>
            <a href="#" class="app-title">Uygulama Ayarları</a>
        </div>
    </header>

    <div class="settings-card">
        <div class="settings-section-title">Görünüm</div>
        
        <div class="setting-item">
            <div class="setting-info">
                <div class="setting-label">Tema Tercihi</div>
                <div class="setting-desc">Koyu veya açık tema arasında geçiş yapın</div>
            </div>
            <button class="theme-toggle-btn" onclick="toggleTheme()" id="theme-btn">
                <span id="theme-icon">🌙</span> <span id="theme-text">Koyu Mod</span>
            </button>
        </div>
    </div>

    <div class="settings-card">
        <div class="settings-section-title">Hakkında</div>
        
        <div class="setting-item">
            <div class="setting-info">
                <div class="setting-label">Uygulama Sürümü</div>
                <div class="setting-desc">Ayetin Vakti Dijital İslami Yardımcı</div>
            </div>
            <div style="font-size: 0.85rem; font-weight: 700; color: var(--accent-color);">v1.2.0</div>
        </div>

        <div class="setting-item">
            <div class="setting-info">
                <div class="setting-label">Resmi YouTube Kanalı</div>
                <div class="setting-desc">Videolarımızı ve içeriklerimizi takip edin</div>
            </div>
            <a href="https://www.youtube.com/@AyetinVakti" target="_blank" class="theme-toggle-btn" style="text-decoration: none;">
                YouTube ›
            </a>
        </div>
    </div>
</div>

<div class="footer">
    © Ayetin Vakti • <span>Huzur ve İbadet Rehberliğiniz</span>
</div>

<script>
    function toggleTheme() {
        const isLight = document.documentElement.classList.toggle('light-mode');
        document.body.classList.toggle('light-mode', isLight);
        localStorage.setItem('theme', isLight ? 'light' : 'dark');
        updateThemeUI(isLight);
    }

    function updateThemeUI(isLight) {
        const icon = document.getElementById('theme-icon');
        const text = document.getElementById('theme-text');
        if (icon) icon.innerText = isLight ? '☀️' : '🌙';
        if (text) text.innerText = isLight ? 'Açık Mod' : 'Koyu Mod';
    }

    document.addEventListener('DOMContentLoaded', () => {
        const savedTheme = localStorage.getItem('theme');
        const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        let isLight = (savedTheme === 'light') || (!savedTheme && !systemPrefersDark);
        
        if (isLight) {
            document.documentElement.classList.add('light-mode');
            document.body.classList.add('light-mode');
        }
        updateThemeUI(isLight);
    });
</script>
</body>
</html>
